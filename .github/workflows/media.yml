name: media
on:
  push:
    paths: ['inbox/**']
  workflow_dispatch:
permissions:
  contents: write
concurrency: media
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -q edge-tts requests && sudo apt-get install -y -qq ffmpeg >/dev/null
      - name: Process inbox
        run: |
          shopt -s nullglob
          for f in inbox/*.url; do
            n=$(basename "$f" .url)
            curl -sSL --fail -o "media/$n.mp3" "$(head -n1 "$f")"
            git rm -q "$f"
          done
          for f in inbox/*.tts; do
            n=$(basename "$f" .tts)
            voice=$(head -n1 "$f"); rate=$(sed -n 2p "$f")
            tail -n +3 "$f" > /tmp/t.txt
            edge-tts --voice "$voice" --rate="$rate" -f /tmp/t.txt \
              --write-media "media/$n.mp3" --write-subtitles "media/$n.srt"
            git rm -q "$f"
          done
      - name: Gemini TTS
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          shopt -s nullglob
          for f in inbox/*.gtts; do
            n=$(basename "$f" .gtts)
            if [ -z "$GEMINI_API_KEY" ]; then echo "GEMINI_API_KEY secret missing"; exit 1; fi
            python tools/gemini_tts.py "$f" "/tmp/$n.wav" || { echo "TTS failed for $n, keeping it in inbox"; continue; }
            ffmpeg -loglevel error -y -i "/tmp/$n.wav" -b:a 160k "media/$n.mp3"
            git rm -q "$f"
          done
      - name: Images (Wikimedia Commons, free licenses)
        continue-on-error: true
        run: |
          shopt -s nullglob
          for f in inbox/*.img; do
            n=$(basename "$f" .img)
            python tools/fetch_images.py "$f" "media/img/$n" || { echo "images failed for $n"; continue; }
            git rm -q "$f"
          done
      - name: Gemini images
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          shopt -s nullglob
          for f in inbox/*.gimg; do
            n=$(basename "$f" .gimg)
            python tools/gemini_image.py "$f" "media/gimg/$n" || true
            git rm -q "$f"
          done
      - name: Free images (Pollinations)
        continue-on-error: true
        run: |
          shopt -s nullglob
          for f in inbox/*.pimg; do
            n=$(basename "$f" .pimg)
            python tools/free_image.py "$f" "media/pimg/$n" || true
            git rm -q "$f"
          done
      - name: YouTube upload (Data API, free)
        continue-on-error: true
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          shopt -s nullglob
          mkdir -p media/yt
          for f in inbox/*.yt; do
            n=$(basename "$f" .yt)
            python tools/yt_upload.py "$f" "media/yt/$n.json" || true
            git rm -q "$f"
          done
      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898900+github-actions[bot]@users.noreply.github.com"
          git add -A media inbox
          git diff --cached --quiet || git commit -m "media: add generated audio"
          git push
