<!doctype html><html><head><meta charset="utf-8">
<!-- "Paisa" money explainer scene: orange theme, continuous 3D camera fly-through past one "station" per idea.
     Data: money_ep.js sets window.EP = {T, brand, ep, caps:[{s,e,html}], st:[{s, kind, big, sub}]}
     kinds: coins | chart | rupee | clock | phone | warn | piggy | arrow -->
<style>
  html,body{margin:0;background:#000;overflow:hidden;font-family:Poppins,Inter,sans-serif}
  #wrap{position:relative;width:720px;height:1280px;overflow:hidden}
  canvas{display:block}
  .ov{position:absolute;pointer-events:none;color:#fff;font-weight:800}
  #brand{top:34px;left:30px;display:flex;gap:10px;align-items:center}
  #brand .b{background:#ff7a00;padding:8px 16px;border-radius:12px;font-size:28px;letter-spacing:1px;box-shadow:0 6px 0 #a34700}
  #brand .d{font-size:22px;background:rgba(0,0,0,.45);padding:6px 12px;border-radius:10px}
  #prog{top:0;left:0;height:8px;background:#ffb000}
  #cap{left:30px;right:30px;top:960px;font-size:56px;line-height:1.12;text-align:center;text-shadow:0 5px 0 #3a1500,0 0 22px rgba(0,0,0,.8)}
  #cap b{color:#ffcf3f}
  #cap span{display:inline-block}
  #note{left:0;right:0;bottom:26px;text-align:center;font-size:18px;font-weight:600;opacity:.7}
</style></head>
<body><div id="wrap">
<div id="prog" class="ov"></div>
<div id="brand" class="ov"><div class="b" id="bb"></div><div class="d" id="ep"></div></div>
<div id="cap" class="ov"></div><div id="note" class="ov">Sirf jaankari ke liye • financial advice nahi</div>
</div>
<script src="money_ep.js"></script>
<script type="importmap">{"imports":{"three":"./three/build/three.module.js","three/addons/":"./three/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
const E=window.EP, W=720, H=1280;
document.getElementById('bb').textContent=E.brand||'PAISA GYAAN';
document.getElementById('ep').textContent=E.ep||'';
const R=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});
R.setPixelRatio(1.5);R.setSize(W,H);R.toneMapping=THREE.ACESFilmicToneMapping;R.outputColorSpace=THREE.SRGBColorSpace;
document.getElementById('wrap').prepend(R.domElement);
const S=new THREE.Scene();S.background=new THREE.Color(0x1a0800);S.fog=new THREE.Fog(0x1a0800,10,34);
const cam=new THREE.PerspectiveCamera(46,W/H,.1,120);
const std=(c,o={})=>new THREE.MeshStandardMaterial({color:c,roughness:o.r??.3,metalness:o.m??.2,emissive:o.e??0,emissiveIntensity:o.ei??1,transparent:!!o.op,opacity:o.op??1});
const M=(g,m,x=0,y=0,z=0)=>{const k=new THREE.Mesh(g,m);k.position.set(x,y,z);return k};
function ctex(w,h,draw){const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');draw(g,w,h);const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=8;return t}
// ---------- world: glowing orange floor grid, light pillars, floating particles
const grid=new THREE.GridHelper(200,100,0xff8a1f,0x5a2400);grid.position.y=-3;grid.material.transparent=true;grid.material.opacity=.6;S.add(grid);
S.add(new THREE.HemisphereLight(0xffe2c0,0x2a0c00,1.2));
const key=new THREE.DirectionalLight(0xfff1dd,2.6);key.position.set(4,8,6);S.add(key);
const glowA=new THREE.PointLight(0xff7a00,40,20),glowB=new THREE.PointLight(0xffc040,30,18);S.add(glowA,glowB);
const parts=[];for(let i=0;i<140;i++){const m=M(new THREE.SphereGeometry(.03+Math.random()*.05,6,6),new THREE.MeshBasicMaterial({color:i%4?0xffa040:0xfff0b0,transparent:true,opacity:.75}),(Math.random()-.5)*22,Math.random()*12-2,-Math.random()*(E.st.length*14+20)+8);m.userData.ph=Math.random()*6;S.add(m);parts.push(m)}
// ---------- coin geometry with rupee face
const rupeeTex=ctex(256,256,(g,w,h)=>{const gr=g.createRadialGradient(w/2,h/2,10,w/2,h/2,w/2);gr.addColorStop(0,'#ffd76a');gr.addColorStop(1,'#e88a00');g.fillStyle=gr;g.fillRect(0,0,w,h);g.strokeStyle='#a85a00';g.lineWidth=14;g.beginPath();g.arc(w/2,h/2,w/2-14,0,7);g.stroke();g.fillStyle='#8a4300';g.font='900 150px sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText('₹',w/2,h/2+8)});
const coinG=new THREE.CylinderGeometry(.55,.55,.14,40);
const coinM=[std(0xe89a10,{m:.8,r:.25}),new THREE.MeshStandardMaterial({map:rupeeTex,metalness:.6,roughness:.3}),new THREE.MeshStandardMaterial({map:rupeeTex,metalness:.6,roughness:.3})];
const coin=()=>new THREE.Mesh(coinG,coinM);
// ---------- card with big word + sub
function card(big,sub){const t=ctex(1024,640,(g,w,h)=>{const gr=g.createLinearGradient(0,0,w,h);gr.addColorStop(0,'#ff8c1a');gr.addColorStop(1,'#ff5a00');g.fillStyle=gr;g.fillRect(0,0,w,h);g.fillStyle='rgba(255,255,255,.12)';for(let i=0;i<9;i++)g.fillRect(i*130-40,0,40,h);g.fillStyle='#fff';g.textAlign='center';let fs=big.length>8?150:210;g.font=`900 ${fs}px Poppins,sans-serif`;while(g.measureText(big).width>w-80){fs-=10;g.font=`900 ${fs}px Poppins,sans-serif`}g.shadowColor='rgba(80,20,0,.6)';g.shadowOffsetY=10;g.fillText(big,w/2,h/2+fs*.28-(sub?40:0));g.shadowOffsetY=0;if(sub){let f2=64;g.font=`800 ${f2}px Poppins,sans-serif`;while(g.measureText(sub).width>w-80){f2-=4;g.font=`800 ${f2}px Poppins,sans-serif`}g.fillStyle='#2a0e00';g.fillText(sub,w/2,h-90)}});
 const grp=new THREE.Group();const box=M(new RoundedBoxGeometry(4.6,2.88,.3,6,.18),[std(0xd85a00),std(0xd85a00),std(0xd85a00),std(0xd85a00),new THREE.MeshStandardMaterial({map:t,roughness:.35,emissive:0xffffff,emissiveMap:t,emissiveIntensity:.35}),std(0xd85a00)]);grp.add(box);return grp}
// ---------- props per kind
function prop(kind){const g=new THREE.Group();g.userData.kind=kind;const items=[];
 if(kind==='coins'){for(let s=0;s<3;s++)for(let i=0;i<8;i++){const c=coin();c.position.set(-1.3+s*1.3,-2.6+i*.15,0);g.add(c);items.push(c)}}
 else if(kind==='chart'){const hs=[.8,1.3,1.9,2.8,4];hs.forEach((h,i)=>{const b=M(new RoundedBoxGeometry(.55,1,.55,3,.08),std(i==4?0xffc23a:0xff7a00,{e:i==4?0xff8800:0,ei:.4}),-1.6+i*.8,-3,0);b.userData.h=h;g.add(b);items.push(b)});const ar=new THREE.Group();ar.add(M(new THREE.CylinderGeometry(.07,.07,3.6,12),std(0xfff0c0,{e:0xffb000,ei:.6})));const hd=M(new THREE.ConeGeometry(.28,.6,16),std(0xfff0c0,{e:0xffb000,ei:.6}),0,2,0);ar.add(hd);ar.rotation.z=-0.9;ar.position.set(0,-.6,.4);g.add(ar);items.push(ar)}
 else if(kind==='rupee'){const t=ctex(512,512,(c,w,h)=>{c.fillStyle='#ffb300';c.font='900 440px sans-serif';c.textAlign='center';c.textBaseline='middle';c.fillText('₹',w/2,h/2+30)});const p=M(new THREE.PlaneGeometry(3,3),new THREE.MeshBasicMaterial({map:t,transparent:true}),0,-.6,0);g.add(p);items.push(p)}
 else if(kind==='clock'){const f=M(new THREE.CylinderGeometry(1.4,1.4,.25,48),std(0xfff3e0),0,-1,0);f.rotation.x=Math.PI/2;g.add(f);const rim=M(new THREE.TorusGeometry(1.45,.12,12,48),std(0xff7a00,{m:.5}),0,-1,0);g.add(rim);const hand=M(new THREE.BoxGeometry(.09,1.1,.05),std(0x2a0e00),0,-1,.2);hand.geometry.translate(0,.5,0);g.add(hand);items.push(hand)}
 else if(kind==='phone'){const ph=M(new RoundedBoxGeometry(1.6,3,.18,4,.2),std(0x1b1b1b,{m:.5}),0,-.9,0);g.add(ph);const sc=M(new THREE.PlaneGeometry(1.4,2.7),new THREE.MeshBasicMaterial({map:ctex(280,540,(c,w,h)=>{const gr=c.createLinearGradient(0,0,0,h);gr.addColorStop(0,'#ffb347');gr.addColorStop(1,'#ff5e00');c.fillStyle=gr;c.fillRect(0,0,w,h);c.fillStyle='#fff';c.font='900 120px sans-serif';c.textAlign='center';c.fillText('₹',w/2,250);c.font='800 40px sans-serif';c.fillText('+ ₹ ₹ ₹',w/2,360)})}),0,-.9,.1);g.add(sc);items.push(ph)}
 else if(kind==='warn'){const tr=M(new THREE.ConeGeometry(1.5,.3,3),std(0xffc400,{e:0xff8800,ei:.3}),0,-1,0);tr.rotation.x=Math.PI/2;tr.rotation.y=Math.PI;g.add(tr);const ex=M(new THREE.PlaneGeometry(1.4,1.4),new THREE.MeshBasicMaterial({map:ctex(256,256,(c,w,h)=>{c.fillStyle='#2a0e00';c.font='900 200px sans-serif';c.textAlign='center';c.textBaseline='middle';c.fillText('!',w/2,h/2+20)}),transparent:true}),0,-1.25,.2);g.add(ex);items.push(tr)}
 else if(kind==='piggy'){const b=M(new THREE.SphereGeometry(1.2,32,24),std(0xff9a3c,{r:.4}),0,-1.3,0);b.scale.set(1.25,1,1);g.add(b);const sn=M(new THREE.CylinderGeometry(.35,.35,.3,24),std(0xff7a1c),1.5,-1.2,0);sn.rotation.z=Math.PI/2;g.add(sn);[[-.7,.5],[.7,.5],[-.7,-.5],[.7,-.5]].forEach(([x,z])=>g.add(M(new THREE.CylinderGeometry(.18,.18,.6,12),std(0xff7a1c),x,-2.4,z)));const c=coin();c.rotation.x=Math.PI/2;c.position.set(0,1,0);g.add(c);items.push(c)}
 else {const a=new THREE.Group();a.add(M(new THREE.CylinderGeometry(.18,.18,2.4,16),std(0xffb000,{e:0xff7a00,ei:.4})));a.add(M(new THREE.ConeGeometry(.5,.9,24),std(0xffb000,{e:0xff7a00,ei:.4}),0,1.6,0));a.position.y=-1;g.add(a);items.push(a)}
 g.userData.items=items;return g}
// ---------- stations along a winding path
const ST=E.st.map((s,i)=>{const z=-i*14,x=(i%2?1:-1)*2.2,y=Math.sin(i*1.3)*.8;const grp=new THREE.Group();grp.position.set(x,y,z);grp.rotation.y=(i%2?-1:1)*.25;
 const c=card(s.big,s.sub);c.position.set(0,1.9,0);grp.add(c);const p=prop(s.kind);p.position.set(0,-.2,.2);grp.add(p);
 const ring=M(new THREE.TorusGeometry(3.4,.04,8,90),new THREE.MeshBasicMaterial({color:0xffa040,transparent:true,opacity:.5}),0,.6,-.6);grp.add(ring);
 S.add(grp);return {...s,i,grp,card:c,prop:p,ring,pos:new THREE.Vector3(x,y,z)}});
// camera anchors: in front of each station, slightly offset; continuous Catmull-Rom path
const camPts=[],lookPts=[];
ST.forEach((s,i)=>{const side=(i%2?1:-1);camPts.push(new THREE.Vector3(s.pos.x*.8-side*.4,s.pos.y+1.1,s.pos.z+10.8));lookPts.push(new THREE.Vector3(s.pos.x,s.pos.y+.7,s.pos.z))});
const last=ST[ST.length-1];camPts.push(new THREE.Vector3(last.pos.x*.2,last.pos.y+1.6,last.pos.z+5.5));lookPts.push(new THREE.Vector3(last.pos.x,last.pos.y+.8,last.pos.z-1));
camPts.unshift(new THREE.Vector3(0,3.5,camPts[0].z+9));lookPts.unshift(lookPts[0].clone());
const camC=new THREE.CatmullRomCurve3(camPts,false,'centripetal'),lookC=new THREE.CatmullRomCurve3(lookPts,false,'centripetal');
const n=camPts.length-1; // segments
const ss=t=>t*t*(3-2*t);
// map time -> curve param: station k reached at its start time, smooth drift during the station, faster glide between
function camU(t){const times=[0,...ST.map(s=>s.s),E.T];// knots: start, each station, end
 let k=0;while(k<times.length-2&&t>=times[k+1])k++;const a=times[k],b=times[k+1];let f=(t-a)/Math.max(.001,b-a);f=Math.min(1,Math.max(0,f));
 // slow drift while the station is on screen, then a fast smooth glide to the next one
 const g=f<.7?(f/.7)*.12:.12+ss((f-.7)/.3)*.88;return Math.min(1,(k+g)/n)}
const capEl=document.getElementById('cap'),prog=document.getElementById('prog');let lastCap=-1;
window.renderFrame=(t)=>{
 const u=camU(t);const p=camC.getPoint(Math.min(1,u)),l=lookC.getPoint(Math.min(1,u));
 const sway=Math.sin(t*.9)*.18;cam.position.set(p.x+sway,p.y+Math.sin(t*.7)*.12,p.z);cam.lookAt(l);cam.rotation.z+=Math.sin(t*.5)*.02;
 glowA.position.set(p.x-2,p.y+2,p.z-5);glowB.position.set(p.x+3,p.y-1,p.z-8);
 parts.forEach(m=>{m.position.y+=Math.sin(t*1.5+m.userData.ph)*.002;m.material.opacity=.4+.35*Math.sin(t*2+m.userData.ph)});
 ST.forEach((s,i)=>{const lt=t-s.s;const on=Math.min(1,Math.max(0,(lt+.6)/.9));const e=1-Math.pow(1-on,3);
  s.card.scale.setScalar(.2+.8*e);s.card.rotation.y=(1-e)*1.4;s.card.position.y=1.9+Math.sin(t*1.4+i)*.08;
  s.ring.rotation.z=t*.4*(i%2?1:-1);s.ring.scale.setScalar(.6+.4*e);
  const it=s.prop.userData.items,k=s.prop.userData.kind,pp=Math.min(1,Math.max(0,lt/1.6));
  if(k==='coins')it.forEach((c,j)=>{const d=Math.min(1,Math.max(0,(lt*6-j%8)/2));c.visible=d>0;c.position.y=-2.6+(j%8)*.15+(1-d)*3;c.rotation.y=t*2+j});
  else if(k==='chart')it.forEach((b,j)=>{if(b.userData.h){const h=Math.max(.01,b.userData.h*ss(Math.min(1,Math.max(0,pp*1.4-j*.12))));b.scale.y=h;b.position.y=-3+h/2}else{b.scale.setScalar(Math.max(.01,ss(Math.min(1,Math.max(0,pp*1.5-.6)))))}});
  else if(k==='clock')it[0].rotation.z=-t*3;
  else if(k==='rupee'||k==='piggy'){it[0].rotation.y=t*2.2;if(k==='piggy')it[0].position.y=1-((t*1.2)%1)*1.4}
  else{it[0].rotation.y=Math.sin(t*1.6)*.4;it[0].scale.setScalar(.2+.8*e)}
 });
 // captions word pop
 const ci=E.caps.findIndex(c=>t>=c.s&&t<c.e);
 if(ci!==lastCap){lastCap=ci;capEl.innerHTML=ci<0?'':E.caps[ci].html.split(/(<b>.*?<\/b>|\s+)/).filter(x=>x&&x.trim()).map(w=>`<span>${w}</span>`).join(' ')}
 if(ci>=0){const c=E.caps[ci];[...capEl.children].forEach((sp,j)=>{const d=Math.min(1,Math.max(0,(t-c.s-j*.09)/.18));sp.style.opacity=d;sp.style.transform=`translateY(${(1-d)*30}px) scale(${.8+.2*d})`})}
 prog.style.width=(t/E.T*720)+'px';
 R.render(S,cam)};
document.fonts.ready.then(()=>{window.READY=true});
</script></body></html>
